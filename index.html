<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>THEA Books</title>

    <link
        rel="stylesheet"
        href="styles.css?v=7"
    >

    <style>

        /* =====================================================
           THEA BOOKS - FINAL SIDEBAR + DASHBOARD LAYOUT
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;
            color: #1f2937;
            overflow-x: hidden;
        }


        /* =====================================================
           MAIN APP SHELL
        ===================================================== */

        .app-shell {

            display: flex;

            width: 100%;
            min-height: 100vh;

            position: relative;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            width: 82px !important;
            min-width: 82px !important;

            height: 100vh;

            background: #111827;

            color: #ffffff;

            display: flex;
            flex-direction: column;

            position: sticky;
            top: 0;

            z-index: 1000;

            overflow: hidden;

            transition:
                width 0.25s ease,
                min-width 0.25s ease;

            box-shadow:
                3px 0 12px rgba(0, 0, 0, 0.08);
        }


        /* SIDEBAR OPEN */

        .sidebar:hover {

            width: 250px !important;
            min-width: 250px !important;
        }


        /* =====================================================
           SIDEBAR BRAND
        ===================================================== */

        .sidebar-brand {

            height: 74px;

            min-height: 74px;

            display: flex;
            align-items: center;

            padding: 0 12px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);

            white-space: nowrap;
        }


        .brand-left {

            display: flex;
            align-items: center;

            gap: 5px;

            min-width: 0;
        }


        /* =====================================================
           BACK / FORWARD / REFRESH
        ===================================================== */

        .app-navigation {

            display: flex;
            align-items: center;

            gap: 3px;

            flex-shrink: 0;
        }


        .app-navigation button {

            width: 22px;
            height: 28px;

            min-width: 22px;

            border: none;

            background: transparent;

            color: #ffffff;

            border-radius: 5px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 14px;

            padding: 0;

            transition:
                background 0.2s ease;
        }


        .app-navigation button:hover {

            background:
                rgba(255, 255, 255, 0.12);
        }


        /* =====================================================
           BRAND TEXT
        ===================================================== */

        .brand-name {

            font-size: 17px;

            font-weight: 700;

            color: #ffffff;

            opacity: 0;

            transform: translateX(-8px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            white-space: nowrap;
        }


        .sidebar:hover .brand-name {

            opacity: 1;

            transform: translateX(0);
        }


        /* =====================================================
           COMPANY TEXT
        ===================================================== */

        .company-text {

            opacity: 0;

            transform: translateX(-8px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            white-space: nowrap;
        }


        .sidebar:hover .company-text {

            opacity: 1;

            transform: translateX(0);
        }


        /* =====================================================
           SIDEBAR MENU
        ===================================================== */

        #mainNavigation {

            flex: 1;

            overflow-y: auto;
            overflow-x: hidden;

            padding:
                10px 8px;

            scrollbar-width: thin;
        }


        #mainNavigation::-webkit-scrollbar {

            width: 5px;
        }


        #mainNavigation::-webkit-scrollbar-thumb {

            background:
                rgba(255, 255, 255, 0.2);

            border-radius: 10px;
        }


        /* =====================================================
           SIDEBAR MENU BUTTONS
        ===================================================== */

        #mainNavigation button {

            width: 100%;

            height: 46px;

            margin-bottom: 5px;

            border: none;

            background: transparent;

            color: #d1d5db;

            border-radius: 8px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 13px;

            padding:
                0 11px;

            font-size: 14px;

            font-weight: 500;

            white-space: nowrap;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        #mainNavigation button:hover {

            background:
                rgba(255, 255, 255, 0.09);

            color: #ffffff;
        }


        #mainNavigation button:active {

            transform: scale(0.98);
        }


        /* =====================================================
           SIDEBAR ICON
        ===================================================== */

        #mainNavigation button::first-letter {

            font-size: 18px;
        }


        /* =====================================================
           SIDEBAR LABEL
        ===================================================== */

        .menu-label {

            opacity: 0;

            transform: translateX(-8px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            white-space: nowrap;
        }


        .sidebar:hover .menu-label {

            opacity: 1;

            transform: translateX(0);
        }


        /* =====================================================
           SIDEBAR BOTTOM
        ===================================================== */

        .sidebar-bottom {

            padding:
                8px;

            border-top:
                1px solid rgba(255, 255, 255, 0.08);
        }


        .sidebar-bottom button {

            width: 100%;

            height: 44px;

            margin-bottom: 5px;

            border: none;

            background: transparent;

            color: #d1d5db;

            border-radius: 8px;

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 13px;

            padding:
                0 11px;

            font-size: 14px;

            white-space: nowrap;
        }


        .sidebar-bottom button:hover {

            background:
                rgba(255, 255, 255, 0.09);

            color: #ffffff;
        }


        .sidebar-brand-footer {

            font-size: 11px;

            color: #6b7280;

            text-align: center;

            padding:
                7px 0 4px;

            opacity: 0;

            white-space: nowrap;

            transition:
                opacity 0.2s ease;
        }


        .sidebar:hover .sidebar-brand-footer {

            opacity: 1;
        }


        /* =====================================================
           MAIN AREA
        ===================================================== */

       .main {
    margin-left: 0;
    flex: 1 1 auto;

    min-width: 0;

    width: auto;

    max-width: none;

    min-height: 100vh;

    background: #f4f7fb;

    overflow-x: hidden;

    transition:
        margin-left 0.25s ease,
        width 0.25s ease;
}

        /* =====================================================
           TOP HEADER
        ===================================================== */

        .top-header {

            min-height: 62px;

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                10px 18px;

            position: sticky;

            top: 0;

            z-index: 500;
        }


        /* =====================================================
           MOBILE MENU BUTTON
        ===================================================== */

        .mobile-menu-btn {

            display: none;

            width: 38px;
            height: 38px;

            border: 1px solid #d1d5db;

            background: #ffffff;

            border-radius: 7px;

            cursor: pointer;

            font-size: 20px;
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-box {

            flex: 1;

            min-width: 120px;

            max-width: 420px;

            position: relative;
        }


        .search-box input {

            width: 100%;

            height: 38px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            padding:
                0 14px;

            outline: none;

            font-size: 14px;

            background: #f9fafb;
        }


        .search-box input:focus {

            border-color: #2563eb;

            background: #ffffff;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar-actions {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-left: auto;

            flex-wrap: nowrap;
        }


        .toolbar-actions button {

            height: 36px;

            border:
                1px solid #d1d5db;

            background: #ffffff;

            color: #374151;

            border-radius: 7px;

            padding:
                0 10px;

            cursor: pointer;

            font-size: 13px;

            white-space: nowrap;

            transition:
                background 0.2s ease,
                border 0.2s ease;
        }


        .toolbar-actions button:hover {

            background: #f3f4f6;

            border-color: #9ca3af;
        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {

            background: #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            min-height: 66px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                12px 22px;

            gap: 12px;
        }


        .page-header h1 {

            margin: 0;

            font-size: 22px;

            color: #111827;
        }


        .new-btn {

            border: none;

            background: #2563eb;

            color: #ffffff;

            border-radius: 7px;

            padding:
                10px 16px;

            cursor: pointer;

            font-weight: 600;

            font-size: 13px;
        }


        .new-btn:hover {

            background: #1d4ed8;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

       #content {

    width: 100%;

    padding: 22px;

    min-height: calc(100vh - 128px);

    overflow-x: auto;
}


        /* =====================================================
           GENERAL PANELS
        ===================================================== */

        .panel {

            background: #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius: 10px;

            padding: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.04);
        }


        .panel h2 {

            margin-top: 0;

            color: #111827;
        }


        /* =====================================================
           FORMS
        ===================================================== */

        .panel form {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .panel label {

            font-size: 13px;

            font-weight: 600;

            color: #374151;

            margin-top: 7px;
        }


        .panel input,
        .panel select,
        .panel textarea {

            width: 100%;

            min-height: 40px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            padding:
                9px 11px;

            font-size: 14px;

            outline: none;

            background: #ffffff;
        }


        .panel input:focus,
        .panel select:focus,
        .panel textarea:focus {

            border-color: #2563eb;
        }


        .form-buttons {

            display: flex;

            gap: 8px;

            margin-top: 15px;
        }


        .cancel-btn {

            border:
                1px solid #d1d5db;

            background: #ffffff;

            color: #374151;

            border-radius: 7px;

            padding:
                10px 16px;

            cursor: pointer;
        }


        .cancel-btn:hover {

            background: #f3f4f6;
        }


        /* =====================================================
           TABLES
        ===================================================== */

        table {

            width: 100%;

            border-collapse: collapse;
        }


        table th {

            text-align: left;

            padding:
                12px 10px;

            background: #f9fafb;

            color: #374151;

            font-size: 13px;

            border-bottom:
                1px solid #e5e7eb;
        }


        table td {

            padding:
                12px 10px;

            border-bottom:
                1px solid #f0f0f0;

            font-size: 13px;

            color: #4b5563;
        }


        table tr:hover td {

            background: #fafafa;
        }


        /* =====================================================
           MOBILE OVERLAY
        ===================================================== */

        .mobile-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.45);

            z-index: 900;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1100px) {

            .toolbar-actions {

                gap: 4px;
            }


            .toolbar-actions button {

                padding:
                    0 7px;

                font-size: 12px;
            }

        }


        @media (max-width: 900px) {

            .sidebar {

                position: fixed;

                left: -250px;

                top: 0;

                width: 250px !important;

                min-width: 250px !important;

                height: 100vh;

                transition:
                    left 0.25s ease;
            }


            .sidebar:hover {

                width: 250px !important;

                min-width: 250px !important;
            }


            .sidebar.mobile-open {

                left: 0;
            }


            .sidebar .brand-name,
            .sidebar .company-text,
            .sidebar .menu-label,
            .sidebar .sidebar-brand-footer {

                opacity: 1;

                transform: translateX(0);
            }


            .main {

                width: 100%;

                min-width: 0;
            }


            .mobile-menu-btn {

                display: flex;

                align-items: center;

                justify-content: center;
            }


            .toolbar-actions {

                overflow-x: auto;

                max-width: 65vw;

                scrollbar-width: none;
            }


            .toolbar-actions::-webkit-scrollbar {

                display: none;
            }


            .mobile-overlay {

                display: none;
            }


            .mobile-overlay.active {

                display: block;
            }


            #content {

                padding:
                    15px;
            }

        }


        @media (max-width: 600px) {

            .top-header {

                padding:
                    8px 10px;

                gap: 7px;
            }


            .search-box {

                max-width: none;
            }


            .toolbar-actions button {

                height: 34px;

                font-size: 11px;

                padding:
                    0 7px;
            }


            .page-header {

                padding:
                    10px 14px;
            }


            .page-header h1 {

                font-size: 19px;
            }


            .page-header .new-btn {

                padding:
                    8px 11px;

                font-size: 12px;
            }


            #content {

                padding:
                    10px;
            }


            .panel {

                padding:
                    14px;
            }


            table {

                min-width: 600px;
            }

        }

    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>


    <!-- =====================================================
         APP SHELL
    ===================================================== -->

    <div class="app-shell">


        <!-- =================================================
             SIDEBAR
        ================================================= -->

        <aside
            class="sidebar"
            id="sidebar"
        >


            <!-- BRAND -->

            <div class="sidebar-brand">

                <div class="brand-left">


                    <!-- BACK / FORWARD / REFRESH -->

                    <div class="app-navigation">

                        <button
                            type="button"
                            onclick="goBack()"
                            title="Back"
                        >
                            ←
                        </button>

                        <button
                            type="button"
                            onclick="goForward()"
                            title="Forward"
                        >
                            →
                        </button>

                        <button
                            type="button"
                            onclick="refreshCurrentPage()"
                            title="Refresh"
                        >
                            ↻
                        </button>

                    </div>


                    <!-- BRAND -->

                    <div class="brand-name">
                        THEA Books
                    </div>

                </div>

            </div>


            <!-- =================================================
                 COMPANY ACCOUNT
            ================================================= -->

            <button
                type="button"
                onclick="showCompanyAccount()"
                style="
                    width:calc(100% - 16px);
                    margin:8px;
                    height:44px;
                    border:none;
                    background:#1f2937;
                    color:#ffffff;
                    border-radius:8px;
                    cursor:pointer;
                    display:flex;
                    align-items:center;
                    gap:13px;
                    padding:0 11px;
                    white-space:nowrap;
                    overflow:hidden;
                "
            >

                <span
                    style="
                        width:24px;
                        min-width:24px;
                        text-align:center;
                        font-size:18px;
                    "
                >
                    🏢
                </span>

                <span class="company-text">
                    Company Account
                </span>

            </button>


            <!-- =================================================
                 MAIN NAVIGATION
            ================================================= -->

            <nav
                id="mainNavigation"
            >


                <button
                    type="button"
                    onclick="showPage('dashboard')"
                >
                    <span>📊</span>
                    <span class="menu-label">
                        Dashboard
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('sales')"
                >
                    <span>🧾</span>
                    <span class="menu-label">
                        Sales
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('purchases')"
                >
                    <span>🛒</span>
                    <span class="menu-label">
                        Purchases
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('expenses')"
                >
                    <span>💰</span>
                    <span class="menu-label">
                        Expenses
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('customers')"
                >
                    <span>👥</span>
                    <span class="menu-label">
                        Customers
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('vendors')"
                >
                    <span>🏢</span>
                    <span class="menu-label">
                        Vendors
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('inventory')"
                >
                    <span>📦</span>
                    <span class="menu-label">
                        Inventory
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('accounting')"
                >
                    <span>📚</span>
                    <span class="menu-label">
                        Accounting
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('receivables')"
                >
                    <span>💵</span>
                    <span class="menu-label">
                        Receivables
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('payables')"
                >
                    <span>📋</span>
                    <span class="menu-label">
                        Payables
                    </span>
                </button>


                <button
                    type="button"
                    onclick="showPage('reports')"
                >
                    <span>📈</span>
                    <span class="menu-label">
                        Reports
                    </span>
                </button>


            </nav>


            <!-- =================================================
                 SIDEBAR BOTTOM
            ================================================= -->

            <div class="sidebar-bottom">


                <button
                    type="button"
                    onclick="showCompanyAccount()"
                >

                    <span
                        style="
                            width:24px;
                            min-width:24px;
                            text-align:center;
                            font-size:18px;
                        "
                    >
                        ⚙️
                    </span>

                    <span class="menu-label">
                        Company
                    </span>

                </button>


                <button
                    type="button"
                    onclick="alert('Help section coming soon.')"
                >

                    <span
                        style="
                            width:24px;
                            min-width:24px;
                            text-align:center;
                            font-size:18px;
                        "
                    >
                        ❓
                    </span>

                    <span class="menu-label">
                        Help
                    </span>

                </button>


                <div class="sidebar-brand-footer">
                    THEA Books • ERP
                </div>


            </div>


        </aside>


        <!-- =====================================================
             MAIN
        ===================================================== -->

        <main class="main">


            <!-- =================================================
                 TOP HEADER
            ================================================= -->

            <header class="top-header">


                <!-- MOBILE MENU -->

                <button
                    type="button"
                    class="mobile-menu-btn"
                    onclick="toggleMobileMenu()"
                    title="Menu"
                >
                    ☰
                </button>


                <!-- SEARCH -->

                <div class="search-box">

                    <input
                        type="text"
                        id="globalSearch"
                        placeholder="Search..."
                    >

                </div>


                <!-- =================================================
                     TOOLBAR ACTIONS
                ================================================= -->

                <div class="toolbar-actions">


                    <button
                        type="button"
                        onclick="showPage('sales')"
                    >
                        🧾 Invoice
                    </button>


                    <button
                        type="button"
                        onclick="showPage('purchases')"
                    >
                        🛒 Purchase
                    </button>


                    <button
                        type="button"
                        onclick="showPage('expenses')"
                    >
                        💸 Expense
                    </button>


                    <button
                        type="button"
                        onclick="openCustomerForm()"
                    >
                        👥 Customer
                    </button>


                    <button
                        type="button"
                        onclick="openVendorForm()"
                    >
                        🏢 Vendor
                    </button>


                    <button
                        type="button"
                        onclick="openProductForm()"
                    >
                        📦 Product
                    </button>


                    <button
                        type="button"
                        onclick="showPage('reports')"
                    >
                        📈 Reports
                    </button>


                    <button
                        type="button"
                        onclick="alert('Help section coming soon.')"
                    >
                        ❓ Help
                    </button>


                    <button
                        type="button"
                        onclick="showCompanyAccount()"
                    >
                        ⚙️ Settings
                    </button>


                    <button
                        type="button"
                        onclick="showCompanyAccount()"
                    >
                        👤 Company
                    </button>


                </div>


            </header>


            <!-- =================================================
                 PAGE HEADER
            ================================================= -->

            <div class="page-header">


                <h1 id="pageTitle">
                    Dashboard
                </h1>


                <button
                    type="button"
                    class="new-btn"
                    onclick="showPage('sales')"
                >
                    + New Transaction
                </button>


            </div>


            <!-- =================================================
                 PAGE CONTENT
            ================================================= -->

            <section id="content">

                <!-- JavaScript pages load here -->

            </section>


        </main>


    </div>


    <!-- =====================================================
         MOBILE OVERLAY
    ===================================================== -->

    <div
        class="mobile-overlay"
        id="mobileOverlay"
        onclick="toggleMobileMenu()"
    ></div>


    <!-- =====================================================
         APP JAVASCRIPT
    ===================================================== -->

    <script
        src="app.js?v=7"
    ></script>


    <!-- =====================================================
         MOBILE MENU SUPPORT
    ===================================================== -->

    <script>

        function toggleMobileMenu() {

            const sidebar =
                document.getElementById("sidebar");

            const overlay =
                document.getElementById("mobileOverlay");

            if (!sidebar) {
                return;
            }

            sidebar.classList.toggle("mobile-open");

            if (overlay) {

                overlay.classList.toggle(
                    "active"
                );

            }

        }

    </script>


</body>

</html>
