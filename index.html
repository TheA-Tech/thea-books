<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THEA Books</title>

    <link rel="stylesheet" href="styles.css?v=4">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand-row">

            <h2>THEA <span>Books</span></h2>

            <button
                class="mobile-menu-btn"
                onclick="toggleMobileMenu()"
            >
                ☰
            </button>

        </div>


        <!-- Company Account -->
        <div class="company-account">

            <button
                class="company-account-btn"
                onclick="showCompanyAccount()"
            >
                <span class="company-icon">🏢</span>

                <span>
                    <strong id="currentCompanyName">
                        Company Account
                    </strong>

                    <small id="currentCompanyStatus">
                        Set up company
                    </small>
                </span>
            </button>

        </div>


        <!-- Navigation -->
       <nav id="mainNavigation">

    <button onclick="showPage('dashboard')">
        <span class="menu-icon">📊</span>
        <span>Dashboard</span>
    </button>

    <button onclick="showPage('sales')">
        <span class="menu-icon">🧾</span>
        <span>Sales</span>
    </button>

    <button onclick="showPage('purchases')">
        <span class="menu-icon">🛒</span>
        <span>Purchases</span>
    </button>

    <button onclick="showPage('expenses')">
        <span class="menu-icon">💰</span>
        <span>Expenses</span>
    </button>

    <button onclick="showPage('customers')">
        <span class="menu-icon">👥</span>
        <span>Customers</span>
    </button>

    <button onclick="showPage('vendors')">
        <span class="menu-icon">🏢</span>
        <span>Vendors</span>
    </button>

    <button onclick="showPage('inventory')">
        <span class="menu-icon">📦</span>
        <span>Inventory</span>
    </button>

    <button onclick="showPage('accounting')">
        <span class="menu-icon">📚</span>
        <span>Accounting</span>
    </button>

    <button onclick="showPage('reports')">
        <span class="menu-icon">📈</span>
        <span>Reports</span>
    </button>

</nav>
    </aside>


    <!-- Main Content -->
    <main class="main">

        <!-- Header -->
        <header>

            <div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

                <p>
                    Business Accounting System
                </p>

            </div>


            <button
                class="new-btn"
                onclick="openTransactionForm()"
            >
                + New Transaction
            </button>

        </header>


        <!-- Dynamic Content -->
        <section id="content">

            <!-- Dashboard will be loaded by app.js -->

        </section>

    </main>


    <!-- JavaScript -->
    <script src="app.js?v=4"></script>

</body>
</html>
