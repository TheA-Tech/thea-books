<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THEA Books</title>

    <link rel="stylesheet" href="styles.css?v=4">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand-row">

            <h2>THEA <span>Books</span></h2>

            <button
                class="mobile-menu-btn"
                onclick="toggleMobileMenu()"
            >
                ☰
            </button>

        </div>


        <!-- Company Account -->
        <div class="company-account">

            <button
                class="company-account-btn"
                onclick="showCompanyAccount()"
            >
                <span class="company-icon">🏢</span>

                <span>
                    <strong id="currentCompanyName">
                        Company Account
                    </strong>

                    <small id="currentCompanyStatus">
                        Set up company
                    </small>
                </span>
            </button>

        </div>


        <!-- Navigation -->
        <nav id="mainNavigation">

            <button onclick="showPage('dashboard')">
                📊 Dashboard
            </button>

            <button onclick="showPage('sales')">
                🧾 Sales
            </button>

            <button onclick="showPage('purchases')">
                🛒 Purchases
            </button>

            <button onclick="showPage('expenses')">
                💰 Expenses
            </button>

            <button onclick="showPage('customers')">
                👥 Customers
            </button>

            <button onclick="showPage('vendors')">
                🏢 Vendors
            </button>

            <button onclick="showPage('inventory')">
                📦 Inventory
            </button>

            <button onclick="showPage('accounting')">
                📚 Accounting
            </button>

            <button onclick="showPage('reports')">
                📈 Reports
            </button>

        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main">

        <!-- Header -->
        <header>

            <div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

                <p>
                    Business Accounting System
                </p>

            </div>


            <button
                class="new-btn"
                onclick="openTransactionForm()"
            >
                + New Transaction
            </button>

        </header>


        <!-- Dynamic Content -->
        <section id="content">

            <!-- Dashboard will be loaded by app.js -->

        </section>

    </main>


    <!-- JavaScript -->
    <script src="app.js?v=4"></script>

</body>
</html>
