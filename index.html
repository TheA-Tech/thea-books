<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THEA Books</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">THEA <span>Books</span></div>
    <nav>
      <button class="nav active" data-page="dashboard">Dashboard</button>
      <button class="nav" data-page="sales">Sales</button>
      <button class="nav" data-page="purchases">Purchases</button>
      <button class="nav" data-page="expenses">Expenses</button>
      <button class="nav" data-page="customers">Customers</button>
      <button class="nav" data-page="vendors">Vendors</button>
      <button class="nav" data-page="inventory">Inventory</button>
      <button class="nav" data-page="accounting">Accounting</button>
      <button class="nav" data-page="reports">Reports</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p>Simple business accounting, built step by step.</p>
      </div>
      <button class="primary" id="newTransaction">+ New Transaction</button>

    <section id="app"></section>

  <script src="app.js"></script>
